<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Шындық па, Қауіп пе? - Интерактивті ойын</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #4f46e5; margin-bottom: 5px; }
        .card-box {
            background-color: #eef2ff;
            border: 2px dashed #6366f1;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 18px;
            color: #1e1b4b;
            text-align: left;
            line-height: 1.5;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { background-color: #4338ca; }
        .category-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        .hidden { display: none; }
        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1-КЕЗЕҢ: Аты-жөнді енгізу -->
        <div id="screen-name">
            <h1>🛡️ «Шындық па, Қауіп пе?»</h1>
            <p>Интерактивті викторина: Жағдаяттарды дұрыс санатқа ажырат!</p>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e5e7eb;">
            <h3>👨‍🎓 Ойынды бастау үшін аты-жөніңізді енгізіңіз</h3>
            <input type="text" id="studentNameInput" placeholder="Аты-жөніңізді жазыңыз (Мысалы: Арман А.)...">
            <button class="btn" onclick="startGame()">🎮 Ойынды бастау</button>
        </div>

        <!-- 2-КЕЗЕҢ: Ойын барысы -->
        <div id="screen-game" class="hidden">
            <div class="info-bar">
                <span id="studentDisplay"></span>
                <span id="scoreDisplay">Ұпай: 0</span>
            </div>
            <h3 id="cardTitle" style="color: #374151;">Карточка 1 / 5</h3>
            <div class="card-box" id="scenarioText">Жағдаят оқылуда...</div>
            <p style="font-weight: bold; color: #4b5563;">❓ Бұл жағдайдың артында қандай қатер тұр?</p>
            <div class="category-btns">
                <button class="btn" style="background-color: #dc2626;" onclick="checkAnswer('Алаяқтық')">🚨 Алаяқтық</button>
                <button class="btn" style="background-color: #d97706;" onclick="checkAnswer('Интернеттегі агрессия')">🔥 Интернеттегі агрессия</button>
                <button class="btn" style="background-color: #2563eb;" onclick="checkAnswer('Ойынға тәуелділік')">⚡ Ойынға тәуелділік</button>
            </div>
        </div>

        <!-- 3-КЕЗЕҢ: Нәтиже -->
        <div id="screen-result" class="hidden">
            <h1>🏆 Ойын аяқталды!</h1>
            <p id="resultStudent" style="font-size: 18px; color: #374151; font-weight: bold;"></p>
            <div id="finalScoreText" style="font-size: 22px; font-weight: bold; color: #16a34a; margin: 20px 0;"></div>
            <p id="feedbackText" style="font-size: 16px; color: #4b5563; margin-bottom: 20px;"></p>
            <button class="btn" onclick="restartGame()">🔄 Қайтадан бастау</button>
        </div>
    </div>

    <script>
        const cardsData = [
            {
                scenario: "1. «Тегін iPhone ұтып алдың!» деген хабарламадағы сілтемеге басып, банк картаңның мәліметтерін жаздың.",
                category: "Алаяқтық"
            },
            {
                scenario: "2. Айдос күніне 8-10 сағат үзбей компьютерлік ойын ойнап, сабаққа бармай, достарымен араласуды тоқтатты.",
                category: "Ойынға тәуелділік"
            },
            {
                scenario: "3. Әлеуметтік желідегі жеке парақшаңа бейтаныс біреулер әдейі жағымсыз, қорлайтын пікірлер жазып, мазақ етті.",
                category: "Интернеттегі агрессия"
            },
            {
                scenario: "4. Интернеттен белгісіз сайттан «көшіріп алу» (скачать) батырмасын басқан едің, компьютерге зиянды вирус келіп түсті.",
                category: "Алаяқтық"
            },
            {
                scenario: "5. Түн ортасына дейін чатта отырып, ұйқының қанбауынан мектепте сабақ кезінде қалғып отырсың.",
                category: "Ойынға тәуелділік"
            }
        ];

        let studentName = "";
        let currentCard = 0;
        let score = 0;

        function startGame() {
            const input = document.getElementById("studentNameInput");
            if (input.value.trim() === "") {
                alert("⚠️ Өтініш, аты-жөніңізді енгізіңіз!");
                return;
            }
            studentName = input.value.trim();
            document.getElementById("studentDisplay").innerText = "👤 Оқушы: " + studentName;
            document.getElementById("screen-name").classList.add("hidden");
            document.getElementById("screen-game").classList.remove("hidden");
            loadCard();
        }

        function loadCard() {
            if (currentCard < cardsData.length) {
                document.getElementById("cardTitle").innerText = `📋 Карточка ${currentCard + 1} / ${cardsData.length}`;
                document.getElementById("scenarioText").innerText = cardsData[currentCard].scenario;
                document.getElementById("scoreDisplay").innerText = "Ұпай: " + score;
            } else {
                showResult();
            }
        }

        function checkAnswer(selectedCategory) {
            const correctCategory = cardsData[currentCard].category;
            if (selectedCategory === correctCategory) {
                score += 2;
                alert("✅ Дұрыс! +2 ұпай!");
            } else {
                alert(`❌ Қате! Дұрыс санат: ${correctCategory}`);
            }
            currentCard++;
            loadCard();
        }

        function showResult() {
            document.getElementById("screen-game").classList.add("hidden");
            document.getElementById("screen-result").classList.remove("hidden");
            document.getElementById("resultStudent").innerText = "Оқушы: " + studentName;
            document.getElementById("finalScoreText").innerText = `Жалпы нәтижеңіз: ${score} / 10 ұпай`;
            
            let feedback = "";
            if (score === 10) {
                feedback = "🌟 Өте керемет! Желідегі қауіпсіздік ережелерін толық білесің!";
            } else if (score >= 6) {
                feedback = "👍 Жақсы нәтиже! Қауіпсіздік негіздерін жақсы түсінесің.";
            } else {
                feedback = "📚 Тағы да қайталап шыққаның дұрыс.";
            }
            document.getElementById("feedbackText").innerText = feedback;
        }

        function restartGame() {
            studentName = "";
            currentCard = 0;
            score = 0;
            document.getElementById("studentNameInput").value = "";
            document.getElementById("screen-result").classList.add("hidden");
            document.getElementById("screen-name").classList.remove("hidden");
        }
    </script>
</body>
</html>
